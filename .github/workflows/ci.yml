name: Basic CI Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main  # Added this for clarity

jobs:
  run-calculator:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'  # Change to your version, e.g., '3.9'

      - name: Install dependencies (if any)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run calculator app
        env:
          CI: true  # Better way to set environment variable fixed here introduced and environment variable set
        run: python src/main.py