name: Calculator CI Test

on: [push, pull_request]

jobs:
  test-basic:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Debug - List files
        run: |
          echo "📁 Project structure:"
          find . -type f -name "*.py" | sort
          echo ""
          echo "📁 src folder:"
          ls -la src/ 2>/dev/null || echo "No src folder"
          echo ""
          echo "📁 .github folder:"
          ls -la .github/workflows/

      - name: Test Python script
        env:
          CI: true
        run: |
          echo "🧪 Running main.py in CI mode..."
          python src/main.py
          echo "✅ Script executed successfully. Well dome mPHOZA!!"